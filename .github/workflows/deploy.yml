name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Pinned curios release tag to pull the wasm playground bundle and rustdoc
  # API docs from. Bump this deliberately when a new curios release is ready.
  CURIOS_TAG: release/0.2.2

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch curios release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CURIOS_TAG" --repo valmirjunior0088/curios \
            --pattern 'curios-wasm.tar.gz' --pattern 'curios-docs.tar.gz' \
            --dir /tmp/curios-release --clobber
          mkdir -p public/curios/docs
          tar -xzf /tmp/curios-release/curios-wasm.tar.gz -C public/curios
          tar -xzf /tmp/curios-release/curios-docs.tar.gz -C public/curios/docs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
